:root,[data-theme=dark]{
  --bg:#15191f;--surf:#1d232b;--surf2:#252c36;--surf3:#2e3743;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --ink:#eaeef3;--mut:#94a0ae;--faint:#6b7684;--acc:#1a9fe0;--acc2:#0b84c4;--acct:#5cc4f7;--on:#fff;--accsoft:rgba(26,159,224,.15);
  --warn:#f2b632;--red:#ff6b6b;--ok:#34c38f;--glass:rgba(29,35,43,.72);--cv:#212830;
  --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.35);--sh2:0 10px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --sans:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:var(--sans)}
[data-theme=light]{
  --bg:#eceef2;--surf:#ffffff;--surf2:#f4f6f8;--surf3:#e9edf1;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.14);
  --ink:#141a21;--mut:#5c6774;--faint:#8b95a1;--acc:#0a8fd1;--acc2:#0877b0;--acct:#0670a6;--on:#fff;--accsoft:rgba(10,143,209,.10);
  --warn:#a86b00;--red:#d43c3c;--ok:#16935f;--glass:rgba(255,255,255,.78);--cv:#ffffff;
  --sh1:0 1px 2px rgba(15,23,42,.06);--sh2:0 12px 32px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body{display:flex;flex-direction:column;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#4f9a87,#2f6457);box-shadow:var(--sh1);flex:none}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand .sub{font:12px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.rooms{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surf2);border:1px solid var(--line)}
.seg button{appearance:none;border:0;background:none;border-radius:999px;width:34px;height:30px;display:grid;place-items:center;color:var(--mut);cursor:pointer;transition:background .18s,color .18s}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh1)}
.ib{appearance:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--sh1);transition:transform .12s,background .18s,opacity .18s}
.ib:active{transform:scale(.94)}.ib[disabled]{opacity:.35;cursor:default}

<script>
(function(){
'use strict';
/* ================= geometry core (no DOM) ================= */
const D2R=Math.PI/180;
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],mul:(a,s)=>[a[0]*s,a[1]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1],cross:(a,b)=>a[0]*b[1]-a[1]*b[0],len:a=>Math.hypot(a[0],a[1])};
const ang=v=>Math.atan2(v[1],v[0])/D2R;
const norm180=a=>{a=((a+180)%360+360)%360-180;return a===-180?180:a};
let uidN=0;const uid=()=>'i'+Date.now().toString(36)+(uidN++).toString(36);
const corner=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'');

function newRoom(name){return{id:uid(),name:name,nameGr:'',num:'',t:150,m:'masonry',walls:[],openings:[],items:[],points:[],place:{mode:'free',x:0,y:0,rot:0}}}
const LDEF={WALLS:'Walls',DOORS:'Doors',WINDOWS:'Windows',PASSAGES:'Passages',PILLARS:'Pillars',SHAFTS:'Shafts',DIMENSIONS:'Dimensions','ROOM-NAMES':'Room names'};
function layerCfg(p){const o={};Object.keys(LDEF).forEach(k=>{const c=(p.layers||{})[k]||{};
  o[k]={name:String(c.name||LDEF[k]).replace(/[<>\/\\":;?*|=,`]/g,'').trim()||LDEF[k],color:(c.color>=1&&c.color<=255)?Math.round(c.color):125};});return o;}
function newProject(){return{name:'',unit:'mm',scale:50,height:3000,rooms:[newRoom('Room 1')],opts:{dims:true,names:true,tags:true},layers:layerCfg({})}}
const textH=p=>{const o=p.opts||{};return o.thUser>0?o.thUser:100;};
const hatchS=p=>{const o=p.opts||{};return o.hsUser>0?o.hsUser:14;};      // as in your drawings
const roomH=(p,r)=>r.h>0?r.h:(p.height>0?p.height:3000);

const MATK=m=>({masonry:1,concrete:1,light:1,none:1}[m]?m:'masonry');
function layoutRoom(room,origin,h0,shared){
  const n=room.walls.length,pts=[origin],ws=[];let h=h0;
  for(let i=0;i<n;i++){const w=room.walls[i];if(i>0)h+=(w.turn||0);
    const d=[Math.cos(h*D2R),Math.sin(h*D2R)];
    ws.push({id:w.id,i:i,len:w.len,h:h,d:d,t:(w.t!=null?w.t:(shared&&i===0?0:room.t)),m:MATK(w.m||room.m)});
    pts.push(V.add(pts[i],V.mul(d,w.len)));}
  const gapV=n?V.sub(pts[0],pts[n]):[0,0],gap=V.len(gapV),closed=n>=3&&gap<1;
  if(closed)pts[n]=pts[0];
  let a2=0;for(let i=0;i<n;i++)a2+=V.cross(pts[i],pts[i+1]);
  if(!closed&&n)a2+=V.cross(pts[n],pts[0]);
  const ccw=a2>=-1e-6;
  ws.forEach((w,i)=>{w.A=pts[i];w.B=pts[i+1];w.n=ccw?[w.d[1],-w.d[0]]:[-w.d[1],w.d[0]];
    w.oa=V.add(w.A,V.mul(w.n,w.t));w.ob=V.add(w.B,V.mul(w.n,w.t));});
  const extra=[];
  const join=(i,j)=>{const a=ws[i],b=ws[j],c=V.cross(a.d,b.d),P=b.A;let X=null;
    if(Math.abs(c)>1e-6){const Qa=V.add(P,V.mul(a.n,a.t)),Qb=V.add(P,V.mul(b.n,b.t));
      X=V.add(Qa,V.mul(a.d,V.cross(V.sub(Qb,Qa),b.d)/c));
      if(V.len(V.sub(X,P))>12*Math.max(a.t,b.t,1))X=null;}
    if(X){a.ob=X;b.oa=X}else if(V.len(V.sub(a.ob,b.oa))>0.01)extra.push([a.ob,b.oa]);};
  for(let i=0;i+1<n;i++)join(i,i+1);
  if(closed)join(n-1,0);
  else if(n){extra.push([ws[0].A,ws[0].oa]);extra.push([ws[n-1].B,ws[n-1].ob]);}
  let cx=0,cy=0;
  if(closed&&Math.abs(a2)>1){for(let i=0;i<n;i++){const k=V.cross(pts[i],pts[i+1]);cx+=(pts[i][0]+pts[i+1][0])*k;cy+=(pts[i][1]+pts[i+1][1])*k;}cx/=3*a2;cy/=3*a2;}
  else{pts.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=pts.length;cy/=pts.length;}
  return{pts:pts,walls:ws,closed:closed,gap:gap,gapV:gapV,ccw:ccw,area:Math.abs(a2)/2,centroid:[cx,cy],extra:extra};
}
function layoutProject(p){
  const out={};
  for(const r of p.rooms){let o=[0,0],h=0;const pl=r.place||{};let done=false;
    if(pl.mode==='attach'&&out[pl.room]){const w=out[pl.room].walls.find(x=>x.id===pl.wall);
      if(w){o=V.add(V.add(w.A,V.mul(w.d,pl.along||0)),V.mul(w.n,w.t));h=ang(pl.flip?w.d:V.mul(w.d,-1));done=true;}}
    if(!done){o=[pl.x||0,pl.y||0];h=pl.rot||0;}
    out[r.id]=layoutRoom(r,o,h,done);}
  return out;
}
const WP=(w,u,v)=>V.add(V.add(w.A,V.mul(w.d,u)),V.mul(w.n,v));
const mm=v=>String(+v.toFixed(1));
const MAT={masonry:{label:'Masonry',pat:'ANSI33'},concrete:{label:'Concrete',pat:'SOLID'},light:{label:'Light partition',pat:'ANSI31'},none:{label:'No fill',pat:''}};
const PT={s1p:{block:'Socket 1P',label:'Socket 1P',w:95.7,tag:'A',def:'16A'},s1u:{block:'Socket 1P UPS',label:'Socket 1P UPS',w:95.7,tag:'A',def:'16A'},
  s3u:{block:'Socket 3P UPS',label:'Socket 3P UPS',w:95.7,tag:'A',def:'16A'},rj:{block:'Socket RJ45',label:'Network RJ45',w:103.3,tag:'CAT',def:'6'},
  water:{block:'Water Tubing',label:'Water supply',tube:1,tag:'H2O/SRW',def:'H2O/SRW'},drain:{block:'Waste Tubing',label:'Drain',tube:1,tag:'DRAIN/WASTE',def:'DRAIN/WASTE'}};
const dd=(a,closed)=>{const o=[];a.forEach(q=>{const l=o[o.length-1];if(!l||V.len(V.sub(l,q))>0.01)o.push(q);});
  if(closed&&o.length>1&&V.len(V.sub(o[0],o[o.length-1]))<=0.01)o.pop();return o;};

function wallCuts(w,clips){ // stretches of wall w removed by openings (its own, or a neighbour room's on a shared wall)
  const out=[];
  for(const c of clips){const cw=c.w;
    if(cw!==w){if(Math.abs(V.cross(w.d,cw.d))>1e-6)continue;
      const va=V.dot(V.sub(w.A,cw.A),cw.n),vb=va+V.dot(w.n,cw.n)*w.t;
      if(Math.min(Math.max(va,vb),c.t)-Math.max(Math.min(va,vb),0)<1)continue;}
    let a=V.dot(V.sub(WP(cw,c.u0,0),w.A),w.d),b=V.dot(V.sub(WP(cw,c.u1,0),w.A),w.d);if(a>b){const x=a;a=b;b=x;}
    a=Math.max(a,0);b=Math.min(b,w.len);if(b-a>0.5)out.push([a,b]);}
  out.sort((p,q)=>p[0]-q[0]);const m=[];
  for(const iv of out){if(m.length&&iv[0]<=m[m.length-1][1]+0.01)m[m.length-1][1]=Math.max(m[m.length-1][1],iv[1]);else m.push(iv.slice());}
  return m;
}
function wallPieces(lay){ // continuous wall outlines, broken only at openings, zero-thickness walls and changes of fill
  const n=lay.walls.length,segs=[];
  lay.walls.forEach((w,i)=>{if(w.t<0.5)return;let u=0;
    for(const iv of w.cuts){if(iv[0]-u>0.5)segs.push({w:w,i:i,a:u,b:iv[0]});u=iv[1];}
    if(w.len-u>0.5)segs.push({w:w,i:i,a:u,b:w.len});});
  const L=segs.length;if(!L)return[];
  const ok=segs.map((s,k)=>{const t=segs[(k+1)%L];return L>1&&Math.abs(s.b-s.w.len)<0.01&&t.a<0.01&&s.w.m===t.w.m&&(t.i===s.i+1||(lay.closed&&s.i===n-1&&t.i===0&&k===L-1));});
  const build=ch=>{const inn=[],out=[];ch.forEach(s=>{inn.push(WP(s.w,s.a,0),WP(s.w,s.b,0));
    out.push(s.a<0.01?s.w.oa:WP(s.w,s.a,s.w.t),Math.abs(s.b-s.w.len)<0.01?s.w.ob:WP(s.w,s.b,s.w.t));});return{inn:inn,out:out};};
  if(lay.closed&&ok.every(x=>x)){const q=build(segs);return[{m:segs[0].w.m,rings:[dd(q.out,true),dd(q.inn,true)]}];}
  const res=[],start=(ok.lastIndexOf(false)+1)%L;let ch=[];
  for(let c=0;c<L;c++){const k=(start+c)%L;ch.push(segs[k]);
    if(!ok[k]){const q=build(ch);res.push({m:ch[0].w.m,rings:[dd(q.inn.concat(q.out.reverse()),true)]});ch=[];}}
  return res;
}

function buildGeometry(p){
  const L=layoutProject(p),opts=p.opts||{},TH=textH(p);
  const G={layouts:L,segs:[],arcs:[],circles:[],polys:[],texts:[],bands:[],floors:[],hits:[],pieces:[],areas:[],points:[],thin:[],warn:[]};
  const clips=[],up=h=>{let r=norm180(h);if(r>90||r<=-90)r=norm180(r+180);return r;};
  for(const r of p.rooms){const lay=L[r.id];
    for(const o of r.openings){const w=lay.walls.find(x=>x.id===o.wall);if(!w)continue;
      const u0=o.fromEnd?w.len-o.off-o.w:o.off,u1=u0+o.w,t=w.t;
      if(u0<-0.5||u1>w.len+0.5)G.warn.push(r.name+': an opening on wall '+corner(w.i)+'-'+corner(w.i+1)+' runs past the wall end.');
      clips.push({w:w,u0:u0,u1:u1,t:t});G.hits.push({room:r.id,open:o.id,quad:[WP(w,u0,0),WP(w,u1,0),WP(w,u1,Math.max(t,60)),WP(w,u0,Math.max(t,60))]});
      let tag='';
      if(o.type==='door'){
        const v0=o.swing==='out'?t:0,dv=o.swing==='out'?1:-1;
        const leaf=(hu,du,rad)=>{const H=WP(w,hu,v0),T=WP(w,hu,v0+dv*rad),C=WP(w,hu+du*rad,v0);
          G.segs.push({a:H,b:T,layer:'DOORS'});let a1=ang(V.sub(T,H)),a2=ang(V.sub(C,H));
          if(((a2-a1)%360+360)%360>180){const x=a1;a1=a2;a2=x;}
          G.arcs.push({c:H,r:rad,a1:a1,a2:a2,layer:'DOORS'});};
        if(o.leaves===2){leaf(u0,1,o.w/2);leaf(u1,-1,o.w/2);}
        else if(o.hinge==='end')leaf(u1,-1,o.w);else leaf(u0,1,o.w);
        G.segs.push({a:WP(w,u0,v0),b:WP(w,u1,v0),layer:'DOORS',dash:true});
        tag='D '+mm(o.w);
      }else if(o.type==='window'){
        [0,t/3,t].forEach(v=>G.segs.push({a:WP(w,u0,v),b:WP(w,u1,v),layer:'WINDOWS'}));
        tag='W '+mm(o.w)+(o.h?'x'+mm(o.h):'')+(o.sill?' sill '+mm(o.sill):'');
      }else{
        [0,t].forEach(v=>G.segs.push({a:WP(w,u0,v),b:WP(w,u1,v),layer:'PASSAGES',dash:true}));
        tag='P '+mm(o.w);
      }
      if(opts.tags)G.texts.push({p:WP(w,(u0+u1)/2,t+TH*1.1),text:tag,h:TH*0.8,rot:up(w.h)});
    }
  }
  for(const r of p.rooms){const lay=L[r.id];
    if(lay.closed){const pts=lay.pts.slice(0,-1);G.floors.push({room:r.id,pts:pts});
      G.areas.push({room:r.id,pts:pts,area:lay.area,c:lay.centroid,en:r.name||'',gr:r.nameGr||'',num:r.num||'#',h:roomH(p,r),th:TH});}
    else if(lay.walls.length)G.warn.push(r.name+': walls do not close yet (gap '+mm(lay.gap)+' mm), so it gets no Area outline or room label.');
    for(const w of lay.walls){w.cuts=wallCuts(w,clips);
      G.bands.push({room:r.id,wall:w.id,quad:[w.A,w.B,w.ob,w.oa],A:w.A,B:w.B});
      if(w.t<0.5)G.thin.push([w.A,w.B]);
      if(opts.dims)G.texts.push({p:WP(w,w.len/2,-TH*1.3),text:mm(w.len),h:TH,rot:up(w.h)});}
    wallPieces(lay).forEach(q=>G.pieces.push({room:r.id,m:q.m,rings:q.rings}));
    for(const it of r.items){const w=lay.walls.find(x=>x.id===it.wall);if(!w)continue;
      const layer=it.kind==='shaft'?'SHAFTS':'PILLARS',m=it.kind==='shaft'?'none':(it.m||'concrete');
      if(it.shape==='round'){const u=(it.fromEnd?w.len-it.along-it.w:it.along)+it.w/2,c=WP(w,u,-(it.off+it.w/2)),rad=it.w/2;
        G.circles.push({c:c,r:rad,layer:layer,kind:it.kind,m:m});G.hits.push({room:r.id,item:it.id,quad:[[c[0]-rad,c[1]-rad],[c[0]+rad,c[1]-rad],[c[0]+rad,c[1]+rad],[c[0]-rad,c[1]+rad]]});
        if(it.kind==='shaft'){const k=rad*Math.SQRT1_2;G.segs.push({a:V.add(c,[-k,-k]),b:V.add(c,[k,k]),layer:layer});G.segs.push({a:V.add(c,[-k,k]),b:V.add(c,[k,-k]),layer:layer});}
      }else{const u0=it.fromEnd?w.len-it.along-it.w:it.along,u1=u0+it.w,v0=-it.off,v1=-(it.off+it.d);
        const q=[WP(w,u0,v0),WP(w,u1,v0),WP(w,u1,v1),WP(w,u0,v1)];
        G.polys.push({pts:q,layer:layer,kind:it.kind,m:m});G.hits.push({room:r.id,item:it.id,quad:q});
        if(it.kind==='shaft'){G.segs.push({a:q[0],b:q[2],layer:layer});G.segs.push({a:q[1],b:q[3],layer:layer});}}
    }
    for(const pt of (r.points||[])){const w=lay.walls.find(x=>x.id===pt.wall),K=PT[pt.kind];if(!w||!K)continue;
      const q=WP(w,pt.fromEnd?w.len-pt.along:pt.along,-(pt.off||0)),rot=K.tube?0:norm180(lay.ccw?w.h:w.h+180);
      G.points.push({room:r.id,id:pt.id,kind:pt.kind,p:q,rot:rot,val:pt.val||K.def});
      G.hits.push({room:r.id,point:pt.id,quad:[[q[0]-130,q[1]-130],[q[0]+130,q[1]-130],[q[0]+130,q[1]+130],[q[0]-130,q[1]+130]]});}
  }
  let b=[Infinity,Infinity,-Infinity,-Infinity];
  const ex=q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[0]);b[3]=Math.max(b[3],q[1]);};
  G.segs.forEach(s=>{ex(s.a);ex(s.b)});G.polys.forEach(q=>q.pts.forEach(ex));G.pieces.forEach(q=>q.rings.forEach(r=>r.forEach(ex)));G.thin.forEach(s=>{ex(s[0]);ex(s[1])});
  G.circles.forEach(c=>{ex([c.c[0]-c.r,c.c[1]-c.r]);ex([c.c[0]+c.r,c.c[1]+c.r])});
  G.arcs.forEach(a=>{ex([a.c[0]-a.r,a.c[1]-a.r]);ex([a.c[0]+a.r,a.c[1]+a.r])});
  (p.ink||[]).forEach(st=>st.pts.forEach(ex));
  if(!isFinite(b[0]))b=[0,0,4000,3000];
  G.bounds=b;return G;

  const hatch=(rings,pat,layer,bulge)=>{if(!pat)return;E('HATCH',layer);g(440,33554597);g(100,'AcDbHatch');g(10,0);g(20,0);g(30,0);g(210,0);g(220,0);g(230,1);
    g(2,pat);g(70,pat==='SOLID'?1:0);g(71,0);g(91,rings.length);
    rings.forEach((r,k)=>{g(92,k?18:3);g(72,bulge?1:0);g(73,1);g(93,r.length);r.forEach(q=>{g(10,f(q[0]));g(20,f(q[1]));if(bulge)g(42,1);});g(97,0);});
    g(75,1);g(76,1);
    if(pat!=='SOLID'){g(52,0);g(41,f(HS));g(77,0);const k=4.490128053*HS;
      if(pat==='ANSI31'){g(78,1);g(53,45);g(43,0);g(44,0);g(45,f(-k/2));g(46,f(k/2));g(79,0);}
      else{g(78,2);g(53,45);g(43,0);g(44,0);g(45,f(-k));g(46,f(k));g(79,0);

    const c=Math.cos(rot*D2R),s=Math.sin(rot*D2R),T=(x,y)=>[pt[0]+x*c-y*s,pt[1]+x*s+y*c];

      const q=T(a.x,a.y),al=(a.halign||a.valign)?T(a.ax,a.ay):q,val=vals[a.tag]!=null?vals[a.tag]:a.text;

    if(c.kind!=='shaft')hatch([[[c.c[0]-c.r,c.c[1]],[c.c[0]+c.r,c.c[1]]]],MAT[c.m].pat,'Room',true);});

    g(72,1);g(11,f(t.p[0]));g(21,f(t.p[1]));g(31,0);g(100,'AcDbText');g(73,2);});
  return (TPL.head.replace('@@SEED@@',hn.toString(16).toUpperCase())+o.join('\n')+'\n'+TPL.tail).replace(/\n/g,'\r\n');
}

const CHANGES=[{"v": "1.10.0", "d": "13 Nov 2026", "items": ["Sketch on the grid and it becomes the real thing: in Walls a line becomes walls (straightened, square corners snapped, closed if you end near the start; drawn away from the room it starts a new room); in Openings a line along a wall becomes a door, window or passage of that width; in Pillars an outline becomes a pillar or shaft (round if you draw a circle); in Sockets a mark becomes the point. Then tap the numbers to set exact sizes.", "Apple Pencil sketches by default; the new sketch button lets a finger or mouse do the same; the highlighter button keeps lines as markup.", "Side panel narrower and denser, and it can be hidden for a full-width drawing.", "Projects are named after the hospital or laboratory; exported files end with the date, e.g. Gen._Hosp._Kavala_20261113.dxf.", "\"Room Height\" used throughout."]}, {"v": "1.9.0", "d": "13 Nov 2026", "items": ["Every step reworked to be shorter and tap-first: one line of guidance, the fields that matter on top, typed positions folded away under \"Or type the position\", and a list of what is already in the room.", "Room: project name and usual height in one compact line once set; names, Room#, height and walls side by side; the position of a second room folded away.", "Export: a checklist of rooms (closed or not, area, height, contents) above one Export DXF button; drawing options folded away.", "An orange Update button appears in the header when a newer release is on GitHub; one tap updates the app and keeps your projects.", "New About page (tap the version in the header, or Settings › About) with how it works and this changelog.", "Author shown in the About page, the laptop window and the README."]}, {"v": "1.8.0", "d": "13 Nov 2026", "items": ["Tap any wall length on the drawing to change it in place; Enter saves and moves on to the next wall, so a whole room can be corrected without leaving the plan.", "Doors, windows, pillars and points show their distances to both corners on the drawing; tap either number to set it exactly."]}, {"v": "1.7.1", "d": "13 Nov 2026", "items": ["A graphic scale bar on the drawing shows what 500 mm, 1 m or 2 m look like; it adapts as you zoom.", "Removed the drawing-scale option: AutoCAD stays 1:1 in millimetres. Text height (100) and hatch scale (14) are fixed defaults you can change on Export."]}, {"v": "1.7.0", "d": "13 Nov 2026", "items": ["The six steps now sit in a floating dock on the drawing: icons with a count or a tick, the current step expanded with its name. Keys 1–6 jump between steps.", "Fit leaves room for the title block and the dock, so the plan is never hidden under them."]}, {"v": "1.6.0", "d": "13 Nov 2026", "items": ["Apple Pencil draws markup on the plan; fingers still pan and zoom. A pen button lets a finger or mouse draw too. Markup goes to the DXF on a new Markup layer (colour 1).", "Rooms can start as a rectangle or an L with typed sizes; a rectangle stays rectangular when you change one side.", "Tap a wall in the drawing to drop a door, window, pillar or socket where you tapped, then drag it along the wall with live distances to both corners.", "Quick turn buttons (90°, 45°, straight) and common sizes for doors, windows and pillars; number fields accept sums such as 1200+850.", "Drawing scale (1:20 to 1:200) and room height set at the start; text height and hatch size follow the scale; the room height is written under the room label.", "Projects kept on the device: save, save as copy, open, delete; one-tap room delete with Undo; Close DXF Sketch stops the laptop helper.", "Notes per room and for the whole project.", "Settings: where it runs, offline status and updates, export with the share sheet or as a download.", "Laptop helper restyled, lists every address the iPad can try, explains what to do when the page keeps loading, and can add the Windows Firewall rule (`--firewall`)."]}, {"v": "1.1.0", "d": "13 Nov 2026", "items": ["First github.io release: works offline on the iPad, Sora font, dark and light AutoCAD-like themes."]}];

function stepWalls(r,lay){

  const d=S.dWall,n=r.walls.length,ins=S.insAfter&&r.walls.find(w=>w.id===S.insAfter),k=ins?r.walls.indexOf(ins)+1:n;

  if(lay.closed&&!ins&&!S.addOpen){h+='<div class="box ok"><b>Room closed.</b> Floor area '+(lay.area/1e6).toFixed(2)+' m²<div class="actions" style="margin-top:10px"><button class="pill sm" data-act="addform">+ Add another wall</button></div></div>';}
  else{h+='<div class="card">';

  if(k>0)h+=field('Turn at corner '+corner(k),'<div class="row"><div class="pills">'+pill('wdir','L','↰ Left',d.dir==='L')+pill('wdir','R','↱ Right',d.dir==='R')+'</div><input type="text" inputmode="decimal" style="flex:0 0 104px" data-d="dWall.ang" value="'+esc(d.ang)+'"><span class="u">°</span></div>');
  h+=field('Wall thickness',inp('data-d="dWall.t" data-enter="addwall"',d.t,(k===0&&r.place.mode==='attach')?'0 (shared wall)':'room default '+fromMM(r.t)));

const ymd=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');};

let DL=null;
function crc32(b){let c,crc=~0;for(let i=0;i<b.length;i++){c=(crc^b[i])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c;}return(~crc)>>>0;}
function zipOne(name,text){ // one stored (uncompressed) file
  const te=new TextEncoder(),nm=te.encode(name),data=te.encode(text),crc=crc32(data),n=nm.length,sz=data.length;

    dv.setUint16(o,20,true);dv.setUint16(o+2,0x0800,true);dv.setUint16(o+4,0,true);dv.setUint16(o+6,0,true);dv.setUint16(o+8,0x21,true);

    if(central){o+=14;}out.set(nm,o);o+=n;};

function download(name,text,type){

    DL.save({filename:dxf?name.replace(/\.dxf$/i,'.zip'):name,data:dxf?zipOne(name,text):text})
      .then(()=>{S.msg=dxf?'Saved as a .zip with the DXF inside — tap it in Files to unpack.':'Saved.';render();})
      .catch(e=>{if(!e||e.code!=='declined'){S.err='The file could not be saved here.';render();}});return;}
  const exp=ST.exp==='auto'?(canShareFiles()?'share':'download'):ST.exp;
  if(exp==='share'&&navigator.share){let file=null;try{file=new File([text],name,{type:/\.dxf$/i.test(name)?'application/dxf':'application/json'});}catch(e){}

function plainDownload(name,text,type){

    else{const wid=t.getAttribute('data-wall');S.wall=wid||S.wall;const w=wid&&wallAt(S.room,wid);
      if(w&&!S.editOpen&&!S.editItem&&!S.editPt&&(S.step===3||S.step===4||S.step===5)){const u=uOnWall(w,e.clientX,e.clientY);
        if(S.step===3){const d=S.dOpen,wd=num(d.w)>0?num(d.w):(d.type==='door'?900:d.type==='window'?1200:1000);d.w=String(wd);d.fromEnd=false;d.off=String(Math.max(0,Math.min(w.len-wd,snap(u-wd/2))));S.room=t.getAttribute('data-room');A.addopen();if(!S.err)S.msg=(d.type[0].toUpperCase()+d.type.slice(1))+' added — drag it to fine-tune.';render();return;}
        if(S.step===4){const d=S.dItem,wd=num(d.w)>0?num(d.w):400;d.w=String(wd);if(!(num(d.d)>0))d.d=String(wd);d.fromEnd=false;d.along=String(Math.max(0,Math.min(w.len-wd,snap(u-wd/2))));A.additem();if(!S.err)S.msg=(d.kind==='shaft'?'Shaft':'Pillar')+' added — drag it along the wall to fine-tune.';render();return;}
        if(S.step===5){const d=S.dPt;d.fromEnd=false;d.along=String(Math.max(0,Math.min(w.len,snap(u))));A.addpt();if(!S.err)S.msg=PT[d.kind].label+' added — drag it to fine-tune.';render();return;}}
      render();}return;}
  if(e.target.closest('input,textarea'))return;
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=A[b.getAttribute('data-act')];if(f){e.preventDefault();f(b.getAttribute('data-v'));}
});
let noteT=0;
document.addEventListener('input',e=>{
  const nk=e.target.getAttribute&&e.target.getAttribute('data-note');
  if(nk){if(nk==='room')room().notes=e.target.value;else S.p.notes=e.target.value;
    document.querySelectorAll('textarea[data-note="'+nk+'"]').forEach(t=>{if(t!==e.target)t.value=e.target.value;});
    clearTimeout(noteT);const ns=$('nsaved');if(ns)ns.textContent='Saving…';noteT=setTimeout(()=>{save();noteBadge();const n2=$('nsaved');if(n2)n2.textContent='Saved on this device';},400);return;}
  const k=e.target.getAttribute&&e.target.getAttribute('data-d');if(!k)return;const q=k.split('.');S[q[0]][q[1]]=e.target.value;});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='dimin'){if(e.key==='Enter'){e.preventDefault();saveDim(true);}else if(e.key==='Escape'){S.dimEdit=null;render();}else if(e.key==='Tab'){e.preventDefault();saveDim(true);}return;}
  if(e.key==='Escape'&&S.sheet){S.sheet=false;renderSheet();return;}
  if(e.key==='Escape'&&S.notesOpen){S.notesOpen=false;renderNotes();return;}
  if((e.metaKey||e.ctrlKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();A.pjsavenow();return;}
  if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')&&!(e.target&&e.target.tagName==='INPUT')){e.preventDefault();(e.shiftKey?A.redo:A.undo)();return;}
  if(/^[1-6]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))&&!S.sheet&&!S.notesOpen){A.step(e.key);return;}
  if(e.key!=='Enter'||(e.target&&e.target.tagName==='TEXTAREA'))return;
  const dc=e.target.getAttribute&&e.target.getAttribute('data-c');if(dc&&dc.indexOf('wall.len:')===0){e.preventDefault();e.target.blur();setTimeout(()=>{A.wnext();const q=document.querySelector('.list li.sel input[data-c^="wall.len"]');if(q){q.focus();q.select();}},0);return;}const k=e.target.getAttribute&&e.target.getAttribute('data-enter');if(k){e.preventDefault();A[k]();}else if(e.target.tagName==='INPUT')e.target.blur();});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pjfile'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(rd.result);if(!p.rooms)throw 0;save();p.id=uid();S.p=p;S.p.opts=S.p.opts||{dims:true,names:true,tags:true};S.room=p.rooms[0].id;S.step=2;S.view=null;S.undo=[];S.redo=[];save();S.msg='Imported “'+(p.name||'project')+'”.';render();renderSheet();t.value='';}catch(x){S.err='That file is not a DXF Sketch project.';render();}};rd.readAsText(f);return;}
  const k=t.getAttribute&&t.getAttribute('data-c');if(!k)return;
  const q=k.split(':'),r=room(),val=t.value;
  commit(()=>{
    if(q[0]==='room.name')r.name=val.trim()||r.name;
    else if(q[0]==='room.nameGr')r.nameGr=val.trim();
    else if(q[0]==='room.num')r.num=val.trim();
    else if(q[0]==='opt.hs'){const v=num(val);S.p.opts.hsUser=v>0?v:null;}
    else if(q[0]==='proj.height'){const v=num(val);if(v>0)S.p.height=v;}
    else if(q[0]==='room.h'){const v=num(val);r.h=(String(val).trim()===''||!(v>0))?null:v;}
    else if(q[0]==='proj.name')S.p.name=val.trim();
    else if(q[0]==='room.t'){const v=toMM(val);if(v>=0)r.t=v;}
    else if(q[0]==='place.along'){const v=toMM(val);if(isFinite(v))r.place.along=v;}
    else if(q[0]==='place.x'||q[0]==='place.y'){const v=toMM(val);if(isFinite(v))r.place[q[0].slice(6)]=v;}
    else if(q[0]==='opt.th'){const v=num(val);S.p.opts.thUser=v>0?v:null;}
    else if(q[0]==='layer.name'||q[0]==='layer.color'){const L=layerCfg(S.p);if(q[0]==='layer.name')L[q[1]].name=val;else{const v=Math.round(num(val));if(v>=1&&v<=255)L[q[1]].color=v;}S.p.layers=L;S.p.layers=layerCfg(S.p);}
    else if(q[0]==='place.rot'){const v=num(val);if(isFinite(v))r.place.rot=v;}
    else{const w=r.walls.find(x=>x.id===q[1]);if(!w)return;
      if(q[0]==='wall.len'){const v=toMM(val);if(v>0){w.len=v;if(r.keepRect&&r.walls.length===4){const o=r.walls[(r.walls.indexOf(w)+2)%4];o.len=v;}}}
      else if(q[0]==='wall.ang'){r.keepRect=false;const v=num(val);if(v>=0&&v<180)w.turn=v*((w.turn||0)<0?-1:1);}
      else if(q[0]==='wall.t'){const v=toMM(val);w.t=(val.trim()===''||!(v>=0))?null:v;}}
  });
});

$('bundo').innerHTML=ICONS.undo;$('bredo').innerHTML=ICONS.redo;$('bexp').innerHTML=ICONS.dl+'<span>Export DXF</span>';$('bzin').innerHTML=ICONS.plus;$('bzout').innerHTML=ICONS.minus;$('bfit').innerHTML=ICONS.fit;
window.addEventListener('resize',()=>{clearTimeout(S._rz);S._rz=setTimeout(renderSketch,120);});
S.theme='dark';try{if(localStorage.getItem('dxf-sketch-theme')==='light')S.theme='light';}catch(e){}
$('bset').innerHTML=ICONS.gear;$('bpanel').innerHTML=ICONS.side;try{if(localStorage.getItem('dxf-sketch-panel')==='off')document.body.classList.add('nopanel');}catch(e){}$('bink').innerHTML=ICONS.hl;$('bsk').innerHTML=ICONS.sk;$('binkx').innerHTML=ICONS.trash;$('ver').textContent='v'+APP_VERSION;$('bproj').innerHTML=ICONS.folder;$('bnotes').innerHTML=ICONS.note+'<span class="badge" id="nbadge" hidden></span>';

const ST={exp:'auto'};try{Object.assign(ST,JSON.parse(localStorage.getItem('dxf-sketch-settings')||'{}'));}catch(e){}
const saveST=()=>{try{localStorage.setItem('dxf-sketch-settings',JSON.stringify(ST));}catch(e){}};
const ENV={artifact:!!(window.claude&&typeof window.claude.use==='function'),standalone:!!((window.navigator&&window.navigator.standalone)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)),
  https:location.protocol==='https:',sw:'none',persist:null};
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'t.dxf',{type:'application/dxf'})]}));}catch(e){return false;}};
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);}return false;};
function showUpd(){const b=$('bupd');if(!b)return;const v=ENV.newVer;if(!(ENV.sw==='update'||v)){b.hidden=true;return;}
  b.hidden=false;b.classList.remove('busy');b.innerHTML=ICONS.upd+'<span>Update'+(v?' to v'+v:'')+'</span>';b.title='A newer DXF Sketch is available'+(v?' (v'+v+')':'')+'. Tap to update; your projects stay.';}
function checkUpdate(){if(ENV.artifact||!ENV.https||!navigator.onLine)return;
  fetch('VERSION?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();if(/^\d+\.\d+\.\d+$/.test(v)&&newer(v,APP_VERSION)){ENV.newVer=v;if(ENV.reg)ENV.reg.update().catch(()=>{});showUpd();}}).catch(()=>{});}
if(!ENV.artifact&&ENV.https){setTimeout(checkUpdate,1500);setInterval(checkUpdate,30*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});window.addEventListener('online',checkUpdate);}
if(!ENV.artifact&&ENV.https&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{ENV.reg=reg;ENV.sw=navigator.serviceWorker.controller?'ready':'installing';
    navigator.serviceWorker.ready.then(()=>{ENV.sw='ready';if(S.sheet)renderSheet();});
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){ENV.sw='update';showUpd();}});});
  }).catch(()=>{ENV.sw='failed';});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(p)ENV.persist=true;else if(ENV.standalone)return navigator.storage.persist().then(x=>{ENV.persist=x;});else ENV.persist=false;}).catch(()=>{});
}
S.p=load();if(!S.p.id)S.p.id=uid();if(S.p.name==='Site sketch')S.p.name='';S.p.unit='mm';if(!(S.p.scale>0))S.p.scale=50;if(!(S.p.height>0))S.p.height=3000;S.p.opts=S.p.opts||{dims:true,names:true,tags:true};S.room=S.p.rooms[0].id;
render();
if(window.claude&&typeof window.claude.use==='function'){try{window.claude.use('downloads').then(d=>{DL=d||null;},()=>{});}catch(x){}}
else if(location.protocol==='http:')fetch('api/ping').then(r=>r.json()).then(j=>{if(j&&j.app==='dxf-sketch'){S.server=true;render();}}).catch(()=>{});
})();
